# Temporary: Windows identity-probe diagnostic for v1.4.1 Task 3. Remove before release.
name: Diag identity probe
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe diagnostics
        shell: bash
        run: node .superpowers/sdd/2026-09-28-codex-plugin-cc-v1.4.1/diag/probe-diag.mjs
